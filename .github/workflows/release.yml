name: Release

on:
  push:
    tags:
      - '*'

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          # Lowest supported PHP version
          php-version: "7.4"
          extensions: intl
          tools: composer:v2
      # package.sh resolves the production dependencies for PHP 7.4 in a clean copy
      - run: composer run package
      - name: Release
        uses: fnkr/github-action-ghr@v1
        env:
          GHR_COMPRESS: zip
          GHR_PATH: releases/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
